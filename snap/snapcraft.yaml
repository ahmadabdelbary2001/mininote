name: mininotes
base: core24
version: '1.0.2'
title: MiniNotes
summary: Offline-first notes application
description: |
  MiniNotes is a fast offline-first notes application built
  with Flutter and Rust FFI.

license: MIT
contact:
  - https://t.me/Ahmad_Abdelbary
issues:
  - https://github.com/ahmadabdelbary2001/mininote/issues
source-code:
  - https://github.com/ahmadabdelbary2001/mininote
website:
  - https://github.com/ahmadabdelbary2001/mininote

grade: stable
confinement: strict
icon: assets/icons/mininotes.svg

apps:
  mininotes:
    command: mininote
    desktop: usr/share/applications/io.github.ahmadabdelbary2001.mininote.desktop
    extensions:
      - gnome
    plugs:
      - home
      - network
      - opengl
      - wayland
      - x11

parts:
  mininotes:
    plugin: dump
    source: flutter_app/build/linux/x64/release/bundle
    organize:
      '*': .
    override-build: |
      craftctl default
      cp "$CRAFT_PART_SRC/../../../../native_core/target/release/libnative_core.so" "$CRAFT_PART_INSTALL/lib/libnative_core.so" 2>/dev/null || true
      cp "$CRAFT_PART_SRC/../../../../native_core/target/release/libnative_core.so" "$CRAFT_PART_INSTALL/libnative_core.so" 2>/dev/null || true
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/applications"
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps"
      cp "$CRAFT_PART_SRC/../../../../packaging/click/mininotes.desktop" "$CRAFT_PART_INSTALL/usr/share/applications/io.github.ahmadabdelbary2001.mininote.desktop" 2>/dev/null || true
      cp "$CRAFT_PART_SRC/../../../../assets/icons/mininotes.svg" "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/io.github.ahmadabdelbary2001.mininote.svg" 2>/dev/null || true
