name: mininotes
base: core24
adopt-info: mininotes
title: MiniNotes
summary: Offline-first notes application
description: |
  MiniNotes is a fast offline-first notes application built
  with Flutter and Rust FFI.

license: MIT
contact:
  - https://t.me/Ahmad_Abdelbary
issues:
  - https://github.com/ahmadabdelbary2001/mininote/issues
source-code:
  - https://github.com/ahmadabdelbary2001/mininote
website:
  - https://github.com/ahmadabdelbary2001/mininote

grade: stable
confinement: strict
icon: assets/icons/mininotes.svg

apps:
  mininotes:
    command: mininote
    desktop: usr/share/applications/io.github.ahmadabdelbary2001.mininote.desktop
    extensions:
      - gnome
    plugs:
      - home
      - network
      - opengl
      - wayland
      - x11
    environment:
      LD_LIBRARY_PATH: $SNAP/lib:$SNAP:$LD_LIBRARY_PATH

parts:
  mininotes:
    plugin: nil
    source: .
    build-packages:
      - curl
      - git
      - unzip
      - xz-utils
      - zip
      - libgtk-3-dev
      - pkg-config
      - clang
      - clang-18
      - llvm-18
      - cmake
      - ninja-build
      - libssl-dev
      - lld
      - binutils
      - liblzma-dev
    stage-packages:
      - libgtk-3-0t64
      - libglib2.0-0t64
      - libglu1-mesa
      - libegl1
      - libx11-6
    override-pull: |
      craftctl default
      VERSION="$(grep '^version:' flutter_app/pubspec.yaml | sed 's/version: //;s/+.*//')"
      test -n "$VERSION"
      craftctl set version="$VERSION"
    override-build: |
      set -euxo pipefail

      # ── 1. Install Flutter ───────────────────────────────────────
      FLUTTER_VERSION="3.41.7"
      FLUTTER_DIR="$CRAFT_PART_BUILD/flutter"
      if [ ! -d "$FLUTTER_DIR" ]; then
        curl -fsSL \
          "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" \
          -o /tmp/flutter.tar.xz
        tar -xf /tmp/flutter.tar.xz -C "$CRAFT_PART_BUILD"
      fi
      export PATH="$FLUTTER_DIR/bin:$PATH"

      # snapcraft runs as root; git refuses directories owned by another uid
      git config --global --add safe.directory "$FLUTTER_DIR"
      git config --global --add safe.directory "$FLUTTER_DIR/.git"

      flutter config --no-analytics
      flutter precache --linux

      # ── 2. Install Rust ─────────────────────────────────────────
      if ! command -v cargo &>/dev/null; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        export PATH="$HOME/.cargo/bin:$PATH"
      fi
      export PATH="$HOME/.cargo/bin:$PATH"

      # ── 3. Build Rust core ───────────────────────────────────────
      cargo build \
        --manifest-path "$CRAFT_PART_SRC/native_core/Cargo.toml" \
        --release

      # ── 4. Build Flutter Linux app ───────────────────────────────
      cd "$CRAFT_PART_SRC/flutter_app"
      flutter pub get
      flutter build linux --release
      cd "$CRAFT_PART_SRC"

      # ── 5. Install bundle into CRAFT_PART_INSTALL ────────────────
      BUNDLE="$CRAFT_PART_SRC/flutter_app/build/linux/x64/release/bundle"
      cp -a "$BUNDLE/." "$CRAFT_PART_INSTALL/"

      # Rename executable (pubspec name = 'mininote')
      [ -f "$CRAFT_PART_INSTALL/mininote" ] || \
        mv "$CRAFT_PART_INSTALL/flutter_app" "$CRAFT_PART_INSTALL/mininote" 2>/dev/null || true
      chmod +x "$CRAFT_PART_INSTALL/mininote"

      # Copy Rust shared library
      cp "$CRAFT_PART_SRC/native_core/target/release/libnative_core.so" \
         "$CRAFT_PART_INSTALL/lib/libnative_core.so"

      # Desktop entry and icon
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/applications"
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps"
      cp "$CRAFT_PART_SRC/packaging/click/mininotes.desktop" \
         "$CRAFT_PART_INSTALL/usr/share/applications/io.github.ahmadabdelbary2001.mininote.desktop"
      cp "$CRAFT_PART_SRC/assets/icons/mininotes.svg" \
         "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/io.github.ahmadabdelbary2001.mininote.svg"
