name: Linux

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - ".github/workflows/linux.yml"
      - "flutter_app/**"
      - "native_core/**"
  pull_request:
    paths:
      - ".github/workflows/linux.yml"
      - "flutter_app/**"
      - "native_core/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.7"

jobs:
  linux:
    name: Linux Desktop x64
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            libgtk-3-dev \
            ninja-build \
            pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native_core -> target

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: flutter_app

      - name: Build Rust core
        run: cargo build --manifest-path native_core/Cargo.toml --release

      - name: Build Flutter Linux app
        run: flutter build linux --release
        working-directory: flutter_app

      - name: Package Linux bundle
        run: |
          set -euo pipefail
          cp native_core/target/release/libnative_core.so \
            flutter_app/build/linux/x64/release/bundle/libnative_core.so
          mkdir -p dist
          tar -C flutter_app/build/linux/x64/release \
            -czf dist/mininote-linux-x64.tar.gz \
            bundle
          test -f dist/mininote-linux-x64.tar.gz

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: mininote-linux-x64
          path: dist/mininote-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          REPO="$GITHUB_REPOSITORY"
          FILES=$(find dist -type f -name "*.tar.gz")

          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --repo "$REPO" --clobber
          else
            gh release create "$TAG" $FILES --repo "$REPO" --title "MiniNote $TAG" --generate-notes
          fi
