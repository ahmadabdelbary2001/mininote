name: flutter-rust-ffi

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - ".github/workflows/flutter-rust-ffi.yml"
      - "flutter_app/**"
      - "native_core/**"
      - "packaging/**"
  pull_request:
    paths:
      - ".github/workflows/flutter-rust-ffi.yml"
      - "flutter_app/**"
      - "native_core/**"
      - "packaging/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.7"

jobs:
  desktop:
    name: Desktop · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux
            flutter_target: linux
            artifact_name: mininote-linux-x64
          - os: windows-2022
            label: Windows
            flutter_target: windows
            artifact_name: mininote-windows-x64
          - os: macos-14
            label: macOS
            flutter_target: macos
            artifact_name: mininote-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: matrix.flutter_target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            libgtk-3-dev \
            ninja-build \
            pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native_core -> target

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: flutter_app

      - name: Build Rust core
        run: cargo build --manifest-path native_core/Cargo.toml --release

      - name: Build Flutter desktop app
        run: flutter build ${{ matrix.flutter_target }} --release
        working-directory: flutter_app

      - name: Package Linux bundle
        if: matrix.flutter_target == 'linux'
        run: |
          set -euo pipefail
          cp native_core/target/release/libnative_core.so \
            flutter_app/build/linux/x64/release/bundle/libnative_core.so
          mkdir -p dist
          tar -C flutter_app/build/linux/x64/release \
            -czf dist/mininote-linux-x64.tar.gz \
            bundle
          test -f dist/mininote-linux-x64.tar.gz

      - name: Package Windows bundle (.zip, .exe, .msi)
        if: matrix.flutter_target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "native_core/target/release/native_core.dll" `
            "flutter_app/build/windows/x64/runner/Release/native_core.dll" -Force

          # 1. Portable ZIP
          if (Test-Path "dist/mininote-windows-x64-portable.zip") { Remove-Item "dist/mininote-windows-x64-portable.zip" -Force }
          Compress-Archive `
            -Path "flutter_app/build/windows/x64/runner/Release/*" `
            -DestinationPath "dist/mininote-windows-x64-portable.zip"

          # 2. Setup EXE (Inno Setup)
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc "packaging/windows/setup.iss"
          } else {
            Write-Warning "Inno Setup ISCC.exe not found, skipping setup.exe creation"
          }

          # 3. MSI Installer (WiX Toolset)
          $wixPath = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          if (Test-Path "$wixPath\heat.exe") {
            & "$wixPath\heat.exe" dir "flutter_app/build/windows/x64/runner/Release" -cg ProductComponents -dr INSTALLFOLDER -sreg -srd -gg -sfrag -out packaging/windows/AppFiles.wxs
            & "$wixPath\candle.exe" -o packaging/windows/installer.wixobj packaging/windows/installer.wxs
            & "$wixPath\candle.exe" -o packaging/windows/AppFiles.wixobj packaging/windows/AppFiles.wxs
            & "$wixPath\light.exe" -ext WixUIExtension packaging/windows/installer.wixobj packaging/windows/AppFiles.wixobj -o dist/mininote-windows-x64.msi
          } else {
            Write-Warning "WiX Toolset not found, skipping MSI build"
          }

      - name: Package macOS bundle (.zip & .dmg)
        if: matrix.flutter_target == 'macos'
        run: |
          set -euo pipefail
          APP_DIR="flutter_app/build/macos/Build/Products/Release/flutter_app.app"
          cp native_core/target/release/libnative_core.dylib \
            "$APP_DIR/Contents/MacOS/libnative_core.dylib"
          mkdir -p dist

          # 1. Zip bundle
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" dist/mininote-macos.zip

          # 2. DMG image
          hdiutil create -volname MiniNote -srcfolder "$APP_DIR" -ov -format UDZO dist/mininote-macos.dmg

          test -f dist/mininote-macos.zip
          test -f dist/mininote-macos.dmg

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android Multi-ABI & Universal
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native_core -> target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: flutter_app

      - name: Build Rust Android libraries (all 4 ABIs)
        working-directory: native_core
        run: |
          rm -rf ../flutter_app/android/app/src/main/jniLibs
          mkdir -p ../flutter_app/android/app/src/main/jniLibs

          cargo ndk \
            -t armeabi-v7a \
            -t arm64-v8a \
            -t x86 \
            -t x86_64 \
            -o ../flutter_app/android/app/src/main/jniLibs \
            build \
            --release

      - name: Build Split ABIs Android APKs
        run: flutter build apk --release --split-per-abi
        working-directory: flutter_app

      - name: Build Universal Android APK & App Bundle (AAB for Play Store)
        run: |
          flutter build apk --release
          flutter build appbundle --release
        working-directory: flutter_app

      - name: Organize Android APK & AAB artifacts
        run: |
          mkdir -p dist/android
          APK_DIR="flutter_app/build/app/outputs/flutter-apk"
          AAB_DIR="flutter_app/build/app/outputs/bundle/release"

          cp "$APK_DIR/app-arm64-v8a-release.apk" dist/android/mininote-android-arm64-v8a.apk || true
          cp "$APK_DIR/app-armeabi-v7a-release.apk" dist/android/mininote-android-armeabi-v7a.apk || true
          cp "$APK_DIR/app-x86-release.apk" dist/android/mininote-android-x86.apk || true
          cp "$APK_DIR/app-x86_64-release.apk" dist/android/mininote-android-x86_64.apk || true
          cp "$APK_DIR/app-release.apk" dist/android/mininote-android-universal.apk || true
          cp "$AAB_DIR/app-release.aab" dist/android/mininote-android-release.aab || true

          ls -la dist/android/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mininote-android-packages
          path: |
            dist/android/*.apk
            dist/android/*.aab
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS (iPhone)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: flutter_app

      - name: Build iOS app without codesign
        run: flutter build ios --release --no-codesign
        working-directory: flutter_app

      - name: Package iOS app bundle & IPA
        run: |
          set -euo pipefail
          mkdir -p dist/ios

          # 1. Unsigned Zip (Runner.app)
          ditto -c -k --sequesterRsrc --keepParent \
            flutter_app/build/ios/iphoneos/Runner.app \
            dist/ios/mininote-ios-unsigned.zip

          # 2. Sideloadable IPA (Payload/Runner.app)
          mkdir -p Payload
          cp -R flutter_app/build/ios/iphoneos/Runner.app Payload/
          zip -r dist/ios/mininote-ios.ipa Payload

          test -f dist/ios/mininote-ios-unsigned.zip
          test -f dist/ios/mininote-ios.ipa

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mininote-ios-packages
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Flutter artifacts to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - desktop
      - android
      - ios
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: mininote-linux-x64
          path: dist/all

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: mininote-windows-x64
          path: dist/all

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: mininote-macos
          path: dist/all

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: mininote-android-packages
          path: dist/all

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: mininote-ios-packages
          path: dist/all

      - name: Upload all Flutter artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="$GITHUB_REF_NAME"
          REPO="$GITHUB_REPOSITORY"

          FILES=$(find dist/all -type f)

          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            # Release already exists – upload all files
            gh release upload "$TAG" $FILES --repo "$REPO" --clobber
          else
            gh release create "$TAG" $FILES --repo "$REPO" --title "MiniNote $TAG" --generate-notes
          fi