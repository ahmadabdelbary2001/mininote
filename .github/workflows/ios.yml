name: iOS

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.7"

jobs:
  ios:
    name: iOS (IPA & Runner.app)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: flutter_app

      - name: Build iOS app without codesign
        run: flutter build ios --release --no-codesign
        working-directory: flutter_app

      - name: Package iOS app bundle & IPA
        run: |
          set -euo pipefail
          mkdir -p dist/ios

          # 1. Unsigned Zip (Runner.app)
          ditto -c -k --sequesterRsrc --keepParent \
            flutter_app/build/ios/iphoneos/Runner.app \
            dist/ios/mininote-ios-unsigned.zip

          # 2. Sideloadable IPA (Payload/Runner.app)
          mkdir -p Payload
          cp -R flutter_app/build/ios/iphoneos/Runner.app Payload/
          zip -r dist/ios/mininote-ios.ipa Payload

          test -f dist/ios/mininote-ios-unsigned.zip
          test -f dist/ios/mininote-ios.ipa

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mininote-ios-packages
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          REPO="$GITHUB_REPOSITORY"
          FILES=$(find dist/ios -type f)

          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --repo "$REPO" --clobber
          else
            gh release create "$TAG" $FILES --repo "$REPO" --title "MiniNote $TAG" --generate-notes
          fi
