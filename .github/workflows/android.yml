name: Android

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - ".github/workflows/android.yml"
      - "flutter_app/**"
      - "native_core/**"
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - "flutter_app/**"
      - "native_core/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.7"

jobs:
  android:
    name: Android Multi-ABI & Play Store
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native_core -> target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: flutter_app

      - name: Build Rust Android libraries (all 4 ABIs)
        working-directory: native_core
        run: |
          rm -rf ../flutter_app/android/app/src/main/jniLibs
          mkdir -p ../flutter_app/android/app/src/main/jniLibs

          cargo ndk \
            -t armeabi-v7a \
            -t arm64-v8a \
            -t x86 \
            -t x86_64 \
            -o ../flutter_app/android/app/src/main/jniLibs \
            build \
            --release

      - name: Build Split ABIs Android APKs
        run: flutter build apk --release --split-per-abi
        working-directory: flutter_app

      - name: Build Universal Android APK & App Bundle
        run: |
          flutter build apk --release
          flutter build appbundle --release
        working-directory: flutter_app

      - name: Organize Android artifacts
        run: |
          mkdir -p dist/android
          APK_DIR="flutter_app/build/app/outputs/flutter-apk"
          AAB_DIR="flutter_app/build/app/outputs/bundle/release"

          cp "$APK_DIR/app-arm64-v8a-release.apk" dist/android/mininote-android-arm64-v8a.apk || true
          cp "$APK_DIR/app-armeabi-v7a-release.apk" dist/android/mininote-android-armeabi-v7a.apk || true
          cp "$APK_DIR/app-x86-release.apk" dist/android/mininote-android-x86.apk || true
          cp "$APK_DIR/app-x86_64-release.apk" dist/android/mininote-android-x86_64.apk || true
          cp "$APK_DIR/app-release.apk" dist/android/mininote-android-universal.apk || true
          cp "$AAB_DIR/app-release.aab" dist/android/mininote-android-release.aab || true

          ls -la dist/android/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mininote-android-packages
          path: |
            dist/android/*.apk
            dist/android/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          REPO="$GITHUB_REPOSITORY"
          FILES=$(find dist/android -type f)

          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --repo "$REPO" --clobber
          else
            gh release create "$TAG" $FILES --repo "$REPO" --title "MiniNote $TAG" --generate-notes
          fi
