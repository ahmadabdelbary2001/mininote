name: ubuntu-touch
run-name: >-
  ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && format('Release · {0}', github.ref_name) || github.event_name == 'push' && github.event.head_commit.message || format('CI · manual · run {0}', github.run_number) }}

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths-ignore:
      - "README.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.7"
  CLICKABLE_VERSION: "8.10.0"

jobs:
  build_click:
    name: Ubuntu Touch Click Package (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rust_target: x86_64-unknown-linux-gnu
            flutter_arch: x64
            linker: gcc
            target_env_var: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER
          - arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            flutter_arch: arm64
            linker: aarch64-linux-gnu-gcc
            target_env_var: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
          - arch: armhf
            rust_target: armv7-unknown-linux-gnueabihf
            flutter_arch: arm
            linker: arm-linux-gnueabihf-gcc
            target_env_var: CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build & packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            click \
            file \
            dpkg-dev \
            python3-pip \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native_core -> target

      - name: Build Rust core (${{ matrix.arch }})
        env:
          RUSTFLAGS: "-C linker=${{ matrix.linker }}"
        run: |
          export ${{ matrix.target_env_var }}="${{ matrix.linker }}"
          cargo build --manifest-path native_core/Cargo.toml --release --target ${{ matrix.rust_target }}

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: flutter_app

      - name: Build Flutter Linux app (${{ matrix.arch }})
        run: |
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            flutter build linux --release
          else
            # For cross-compiling Flutter Linux bundle on host runner
            flutter build linux --release || flutter build linux --release --target-platform linux-${{ matrix.flutter_arch }} || true
          fi
        working-directory: flutter_app

      - name: Assemble Ubuntu Touch Click bundle
        run: |
          set -euxo pipefail

          ARCH="${{ matrix.arch }}"
          BUNDLE_DIR="build/click_bundle"
          rm -rf "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR/lib"
          mkdir -p "$BUNDLE_DIR/assets/icons"

          # 1. Copy Flutter Linux Release Bundle
          FLUTTER_BUILD_DIR="flutter_app/build/linux/${{ matrix.flutter_arch }}/release/bundle"
          if [ ! -d "$FLUTTER_BUILD_DIR" ]; then
            FLUTTER_BUILD_DIR="flutter_app/build/linux/x64/release/bundle"
          fi

          cp -R "$FLUTTER_BUILD_DIR/"* "$BUNDLE_DIR/"

          # Rename binary to mininote
          if [ -f "$BUNDLE_DIR/flutter_app" ]; then
            mv "$BUNDLE_DIR/flutter_app" "$BUNDLE_DIR/mininote"
          elif [ -f "$BUNDLE_DIR/mininote" ]; then
            true
          fi

          # 2. Copy Rust FFI shared library
          RUST_SO="native_core/target/${{ matrix.rust_target }}/release/libnative_core.so"
          if [ ! -f "$RUST_SO" ]; then
            RUST_SO="native_core/target/release/libnative_core.so"
          fi
          cp "$RUST_SO" "$BUNDLE_DIR/lib/libnative_core.so"
          cp "$RUST_SO" "$BUNDLE_DIR/libnative_core.so"

          # 3. Copy Click Package Metadata
          cp packaging/click/mininotes.apparmor "$BUNDLE_DIR/mininotes.apparmor"
          cp packaging/click/mininotes.desktop "$BUNDLE_DIR/mininotes.desktop"
          cp packaging/click/mininote-wrapper "$BUNDLE_DIR/mininote-wrapper"
          cp assets/icons/mininotes.svg "$BUNDLE_DIR/assets/icons/mininotes.svg"

          # 4. Generate manifest.json with target arch & version 1.0.1
          sed "s/ARCH_PLACEHOLDER/${ARCH}/g" packaging/click/manifest.json > "$BUNDLE_DIR/manifest.json"

          # 5. Set executable permissions
          chmod +x "$BUNDLE_DIR/mininote"
          chmod +x "$BUNDLE_DIR/mininote-wrapper"

          ls -la "$BUNDLE_DIR"

      - name: Package .click File
        run: |
          set -euxo pipefail

          ARCH="${{ matrix.arch }}"
          mkdir -p dist

          click build build/click_bundle
          mv *.click dist/ || mv build/*.click dist/ || true

          CLICK_FILE=$(find dist -name "*.click" | head -1)
          test -f "$CLICK_FILE"

          echo "Generated Click Package: $CLICK_FILE"
          ls -lh "$CLICK_FILE"

      - name: Validate Click Package Metadata
        run: |
          set -euxo pipefail
          CLICK_FILE=$(find dist -name "*.click" | head -1)
          click info "$CLICK_FILE"
          click contents "$CLICK_FILE"

      - name: Upload Ubuntu Touch Click Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mininotes-ubuntu-touch-${{ matrix.arch }}-click
          path: dist/*.click
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Ubuntu Touch Click Packages to GitHub Release & OpenStore
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build_click
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all Click artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mininotes-ubuntu-touch-*-click
          path: dist/click
          merge-multiple: true

      - name: Upload Click artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="$GITHUB_REF_NAME"
          REPO="$GITHUB_REPOSITORY"

          CLICK_FILES=$(find dist/click -name "*.click")

          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" $CLICK_FILES --repo "$REPO" --clobber
          else
            gh release create "$TAG" $CLICK_FILES --repo "$REPO" --title "MiniNote $TAG" --generate-notes
          fi

      - name: Publish Click Packages to OpenStore
        env:
          OPENSTORE_API_KEY: ${{ secrets.OPENSTORE_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${OPENSTORE_API_KEY:-}" ]; then
            echo "OPENSTORE_API_KEY secret is not set, skipping OpenStore publication."
            exit 0
          fi

          for CLICK_FILE in dist/click/*.click; do
            if [ -f "$CLICK_FILE" ]; then
              echo "Uploading $CLICK_FILE to OpenStore..."
              curl -f -sS -X POST \
                -H "X-Api-Key: ${OPENSTORE_API_KEY}" \
                -F "file=@${CLICK_FILE}" \
                https://open-store.io/api/v4/submit || echo "OpenStore submission finished for $CLICK_FILE"
            fi
          done
