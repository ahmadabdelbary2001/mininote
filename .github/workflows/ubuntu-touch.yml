name: ubuntu-touch
run-name: >-
  ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && format('Release · {0}', github.ref_name) || github.event_name == 'push' && github.event.head_commit.message || format('CI · manual · run {0}', github.run_number) }}

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.7"
  CLICKABLE_VERSION: "8.10.0"

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Generate release notes (tags only)
  # ─────────────────────────────────────────────────────────────
  notes:
    name: Generate Release Notes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          set -euo pipefail
          CURRENT_TAG="$GITHUB_REF_NAME"
          CURRENT_SHA="$GITHUB_SHA"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${CURRENT_SHA}^" 2>/dev/null || true)"
          PREVIOUS_TAG="${PREVIOUS_TAG:-}"

          python3 - "$CURRENT_TAG" "$CURRENT_SHA" "$PREVIOUS_TAG" <<'PY'
          import re, subprocess, sys
          from pathlib import Path

          current_tag  = sys.argv[1]
          current_sha  = sys.argv[2]
          previous_tag = sys.argv[3]

          revision_range = f"{previous_tag}..{current_sha}" if previous_tag else current_sha

          result = subprocess.run(
              ["git", "log", "--first-parent", "--no-merges", "--format=%s", revision_range],
              check=True, capture_output=True, text=True
          )

          subjects = [l.strip() for l in result.stdout.splitlines() if l.strip()]
          features, fixes, improvements, other = [], [], [], []

          pattern = re.compile(r"^(?P<type>[a-zA-Z]+)(?:\([^)]*\))?!?:\s*(?P<subject>.+)$")
          for s in subjects:
              m = pattern.match(s)
              if m:
                  kind = m.group("type").lower()
                  text = m.group("subject").strip()
                  if kind == "feat":                             features.append(text)
                  elif kind == "fix":                           fixes.append(text)
                  elif kind in {"refactor","perf","ui","ux"}:   improvements.append(text)
                  else:                                         other.append(text)
              else:
                  other.append(s)

          lines = ["## Changes", ""]
          def sec(title, items):
              if items:
                  lines.extend([f"### {title}", ""] + [f"- {i}" for i in items] + [""])
          sec("Features", features)
          sec("Fixes", fixes)
          sec("Improvements", improvements)
          sec("Other Changes", other)
          if not (features or fixes or improvements or other):
              lines.extend(["- Maintenance and stability release.", ""])

          out = "\n".join(lines).rstrip() + "\n"
          Path("release-notes.md").write_text(out, encoding="utf-8")
          print(out)
          PY

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: mininotes-release-notes
          path: release-notes.md
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 2. Build .click packages (amd64, arm64)
  # ─────────────────────────────────────────────────────────────
  build_click:
    name: Build Click (${{ matrix.arch }})
    needs: []
    runs-on: ${{ matrix.runner }}
    # The release engine is built from source, which takes a while.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            linker: gcc
            target_env_var: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER
          - arch: arm64
            # Native ARM64 runner: no cross compilation needed for the
            # engine, the embedder or the Rust binaries.
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            linker: gcc
            target_env_var: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER

    env:
      # One definition for both the restore and the save below: if the two
      # keys ever drifted apart the cache would silently never hit.
      # The key contains the Flutter version, because the engine revision is
      # derived from it (bin/internal/engine.version).  The `env` context is
      # not available in a job level `env` block, so the version is spelled
      # out here and has to match FLUTTER_VERSION above.
      ENGINE_CACHE_KEY: flutter-release-engine-3.41.7-${{ matrix.arch }}-fontconfig

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          # The release engine build needs a lot of room.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/share/boost \
                      /opt/ghc /usr/local/.ghcup /usr/lib/jvm /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang llvm lld cmake ninja-build pkg-config patchelf \
            libfontconfig1-dev liblzma-dev \
            libegl1-mesa-dev libgles2-mesa-dev libglib2.0-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libinput-dev libudev-dev wayland-protocols \
            libmaliit-glib-dev \
            unzip curl file python3 git pipx

          # Ensure maliit-glib header paths are accessible for all include formats
          if [ -d "/usr/include/maliit-2/maliit-glib" ] && [ ! -d "/usr/include/maliit-glib" ]; then
            sudo ln -sf /usr/include/maliit-2/maliit-glib /usr/include/maliit-glib || true
          fi

          # 'click' provides the click packaging tool.
          sudo apt-get install -y --no-install-recommends click
          command -v click || { echo "ERROR: 'click' command not found after installation" >&2; exit 1; }
          echo "  [OK] click available at: $(command -v click)"

          # Install clickable via pipx (isolated venv)
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          if command -v pipx &>/dev/null; then
            pipx install "clickable-ut==${{ env.CLICKABLE_VERSION }}"
          else
            echo "WARNING: pipx not available; skipping clickable install" >&2
          fi

      # ── Flutter: manual install to guarantee version+architecture match ──
      # subosito/flutter-action fails to resolve flutter 3.41.7 for arm64
      # host runners. We install Flutter from the official SDK tarball
      # directly — this gives us the exact version and the correct host-arch
      # toolchain.
      #
      # IMPORTANT: extract to $HOME (not /opt) so the runner user owns
      # all files. Flutter writes engine.stamp, cache/, etc. at runtime
      # and will fail with "Permission denied" if those paths are root-owned.
      - name: Install Flutter ${{ env.FLUTTER_VERSION }} (manual)
        run: |
          set -euo pipefail
          FLUTTER_TAR="flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz"
          FLUTTER_URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${FLUTTER_TAR}"
          echo "Downloading Flutter SDK: $FLUTTER_URL"
          curl -sSLf "$FLUTTER_URL" -o "/tmp/${FLUTTER_TAR}"
          # Extract as current user (no sudo) to a user-writable path
          tar -xf "/tmp/${FLUTTER_TAR}" -C "${HOME}" --no-same-owner
          rm -f "/tmp/${FLUTTER_TAR}"

          # The published Linux tarball ships an x64 Dart SDK and an x64
          # flutter_tools snapshot.  On an ARM64 runner both have to be
          # replaced by their ARM64 counterparts, otherwise the flutter tool
          # aborts with "Snapshot not compatible with the current VM
          # configuration" (the snapshot says x64, the VM says arm64).
          #
          # Removing the Dart SDK alone is not enough: the SDK is only
          # refreshed while the flutter tool rebuilds itself, so the download
          # is triggered explicitly and the tool snapshot is invalidated.
          if [ "$(uname -m)" = "aarch64" ]; then
            echo "ARM64 host detected: replacing the bundled x64 toolchain"
            rm -rf "${HOME}/flutter/bin/cache/dart-sdk" \
                   "${HOME}/flutter/bin/cache/engine-dart-sdk.stamp" \
                   "${HOME}/flutter/bin/cache/flutter_tools.snapshot" \
                   "${HOME}/flutter/bin/cache/flutter_tools.stamp"
            # update_dart_sdk.sh reads the engine stamp from the cache.
            if [ ! -f "${HOME}/flutter/bin/cache/engine.stamp" ]; then
              cp "${HOME}/flutter/bin/internal/engine.version" \
                 "${HOME}/flutter/bin/cache/engine.stamp"
            fi
            [ -f "${HOME}/flutter/bin/cache/engine.realm" ] || \
              : > "${HOME}/flutter/bin/cache/engine.realm"
            "${HOME}/flutter/bin/internal/update_dart_sdk.sh"
            test -x "${HOME}/flutter/bin/cache/dart-sdk/bin/dart" || {
              echo "ERROR: the ARM64 Dart SDK could not be downloaded." >&2
              exit 1
            }
            "${HOME}/flutter/bin/cache/dart-sdk/bin/dart" --version
          fi

          echo "${HOME}/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter precache (Linux)
        run: |
          set -euo pipefail
          # Ensure the cache directory is writable before Flutter touches it
          mkdir -p "${HOME}/flutter/bin/cache"
          flutter precache --linux
          flutter --version

      - name: Resolve Engine SHA & validate toolchain
        run: |
          set -euo pipefail
          FLUTTER_ROOT="${HOME}/flutter"
          ENGINE_SHA="$(cat "${FLUTTER_ROOT}/bin/internal/engine.version" | tr -d '[:space:]')"

          echo "══════════════════════════════════════════════════════"
          echo "  Flutter version: $(flutter --version 2>&1 | head -1)"
          echo "  Dart version:    $("${FLUTTER_ROOT}/bin/dart" --version 2>&1)"
          echo "  Engine SHA:      ${ENGINE_SHA}"
          echo "  Architecture:    ${{ matrix.arch }}"
          echo "  Runner arch:     $(uname -m)"
          echo "══════════════════════════════════════════════════════"

          # Verify frontend_server
          echo ""
          echo "frontend_server candidates:"
          find "${FLUTTER_ROOT}/bin/cache" -name "*frontend_server*.snapshot" \
              2>/dev/null | head -5 || echo "  (none in cache yet)"

          # Verify flutter_patched_sdk_product
          echo ""
          echo "flutter_patched_sdk_product:"
          find "${FLUTTER_ROOT}/bin/cache/artifacts/engine" -name "*flutter_patched_sdk*" \
              -type d 2>/dev/null | head -3 || echo "  (none in cache yet)"

          echo ""
          echo "Engine SHA pinned: ${ENGINE_SHA}"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native_core -> target
            flutter_embedder -> target
            flutter_app/elinux/runner -> target

      # ── Release Flutter engine ──────────────────────────────────────────
      # The engine published on the Flutter CDN is a JIT/debug build that
      # cannot load an AOT snapshot, so it is built from source here, in
      # release mode, from the exact engine revision of the Flutter SDK.
      #
      # restore/save rather than actions/cache: that one only saves in its
      # post step, which is skipped when the job fails, so a later failure
      # would throw away a good engine build and make the next run redo the
      # whole thing.
      - name: Restore Flutter release engine cache
        id: engine-cache
        uses: actions/cache/restore@v4
        with:
          path: build/engine-artifacts/${{ matrix.arch }}
          key: ${{ env.ENGINE_CACHE_KEY }}

      - name: Build Flutter release engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          bash scripts/build-engine.sh "${{ matrix.arch }}"

      # Placed right after the build so a failure further down the job (app
      # build, packaging) still leaves the engine cached for the next run.
      - name: Save Flutter release engine cache
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/engine-artifacts/${{ matrix.arch }}
          key: ${{ env.ENGINE_CACHE_KEY }}

      - name: Verify engine artifacts
        run: |
          set -euo pipefail
          DIR="build/engine-artifacts/${{ matrix.arch }}"
          echo "=== Engine artifacts for ${{ matrix.arch }} ==="
          ls -lh "$DIR/"
          file "$DIR/libflutter_engine.so"
          file "$DIR/gen_snapshot"

          # Assert the arches, so a restored-from-cache or mis-toolchained
          # artifact fails here instead of deep in the app build. The engine
          # is a target binary; gen_snapshot must run on this runner.
          case ${{ matrix.arch }} in
            amd64) ENGINE_ARCH="x86-64" ; HOST_ARCH="x86-64" ;;
            arm64) ENGINE_ARCH="aarch64" ; HOST_ARCH="aarch64" ;;
          esac
          file -b "$DIR/libflutter_engine.so" | grep -q "$ENGINE_ARCH" || {
            echo "ERROR: libflutter_engine.so is not $ENGINE_ARCH" >&2; exit 1; }
          file -b "$DIR/gen_snapshot" | grep -q "$HOST_ARCH" || {
            echo "ERROR: gen_snapshot is not runnable on this $HOST_ARCH host" >&2; exit 1; }
          echo "OK: engine is $ENGINE_ARCH, gen_snapshot is host ($HOST_ARCH)"

      # ── Unit tests: Rust (host only) + Flutter ──────────────────────────
      - name: Run Unit Tests (Rust host + Flutter)
        run: |
          set -euo pipefail
          # Native Rust tests (host arch, always safe)
          cargo test --manifest-path native_core/Cargo.toml
          # Syntax/type-check the target crate
          cargo check \
            --manifest-path flutter_embedder/Cargo.toml \
            --target ${{ matrix.rust_target }}
          cargo check \
            --manifest-path flutter_app/elinux/runner/Cargo.toml \
            --target ${{ matrix.rust_target }}
          # Flutter unit tests
          (cd flutter_app && flutter test)
        env:
          ${{ matrix.target_env_var }}: ${{ matrix.linker }}

      # ── Full application build ───────────────────────────────────────────
      - name: Build MiniNotes App and Click Package (${{ matrix.arch }})
        env:
          ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
          LINKER: ${{ matrix.linker }}
          ${{ matrix.target_env_var }}: ${{ matrix.linker }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          bash scripts/build-app.sh "${{ matrix.arch }}"

      - name: Validate Click package
        run: |
          set -euo pipefail
          CLICK_FILE="$(find dist -name "*.click" | head -1)"
          test -f "$CLICK_FILE"

          echo "=== Inspecting Generated Click Package: $CLICK_FILE ==="
          ls -lh "$CLICK_FILE"
          click info "$CLICK_FILE"

          echo "=== Click Package Internal Size Breakdown ==="
          dpkg-deb -c "$CLICK_FILE" 2>/dev/null || true

          if command -v clickable &>/dev/null; then
            echo "=== Running Mandatory Clickable Review ==="
            clickable review "$CLICK_FILE"
          fi

      - name: Upload Click artifact
        uses: actions/upload-artifact@v4
        with:
          name: mininotes-ubuntu-touch-${{ matrix.arch }}-click
          path: |
            dist/*.click
          if-no-files-found: warn
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # 3. Publish to OpenStore & GitHub Release  (tags only)
  # ─────────────────────────────────────────────────────────────
  release:
    name: Publish to OpenStore & GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - notes
      - build_click
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all Click artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mininotes-ubuntu-touch-*-click
          path: dist/click
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: mininotes-release-notes
          path: .ci/release-notes

      - name: Verify click packages
        run: |
          set -euxo pipefail
          ls -lh dist/click/
          COUNT=$(find dist/click -name "*.click" | wc -l)
          echo "Found $COUNT .click package(s)"
          if [ "$COUNT" -lt 2 ]; then
            echo "::error::Expected at least arm64 and amd64 .click packages, found $COUNT"
            find dist/click -name "*.click"
            exit 1
          fi

      - name: Upload All Click Packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          REPO="$GITHUB_REPOSITORY"
          FILES=$(find dist/click -name "*.click")

          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --repo "$REPO" --clobber
          else
            gh release create "$TAG" $FILES \
              --repo "$REPO" \
              --title "MiniNote $TAG" \
              --notes-file .ci/release-notes/release-notes.md
          fi

      - name: Install dependencies for publishing
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends click file python3-pip
          python3 -m pip install --break-system-packages requests "clickable-ut==${{ env.CLICKABLE_VERSION }}"

      - name: Publish to OpenStore
        env:
          OPENSTORE_API_KEY: ${{ secrets.OPENSTORE_API_KEY }}
          CLICKABLE_NON_INTERACTIVE: "1"
        run: |
          set -euo pipefail
          if [ -z "${OPENSTORE_API_KEY:-}" ]; then
            echo "::error::OPENSTORE_API_KEY secret is not set. Cannot publish to OpenStore."
            exit 1
          fi
          echo "=== Publishing Click packages to OpenStore ==="
          python3 scripts/publish_openstore.py
