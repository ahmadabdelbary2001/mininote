name: ubuntu-touch
run-name: >-
  ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && format('Release · {0}', github.ref_name) || github.event_name == 'push' && github.event.head_commit.message || format('CI · manual · run {0}', github.run_number) }}

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.7"
  CLICKABLE_VERSION: "8.10.0"

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Generate release notes (tags only)
  # ─────────────────────────────────────────────────────────────
  notes:
    name: Generate Release Notes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          set -euo pipefail
          CURRENT_TAG="$GITHUB_REF_NAME"
          CURRENT_SHA="$GITHUB_SHA"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${CURRENT_SHA}^" 2>/dev/null || true)"
          PREVIOUS_TAG="${PREVIOUS_TAG:-}"

          python3 - "$CURRENT_TAG" "$CURRENT_SHA" "$PREVIOUS_TAG" <<'PY'
          import re, subprocess, sys
          from pathlib import Path

          current_tag  = sys.argv[1]
          current_sha  = sys.argv[2]
          previous_tag = sys.argv[3]

          revision_range = f"{previous_tag}..{current_sha}" if previous_tag else current_sha

          result = subprocess.run(
              ["git", "log", "--first-parent", "--no-merges", "--format=%s", revision_range],
              check=True, capture_output=True, text=True
          )

          subjects = [l.strip() for l in result.stdout.splitlines() if l.strip()]
          features, fixes, improvements, other = [], [], [], []

          pattern = re.compile(r"^(?P<type>[a-zA-Z]+)(?:\([^)]*\))?!?:\s*(?P<subject>.+)$")
          for s in subjects:
              m = pattern.match(s)
              if m:
                  kind = m.group("type").lower()
                  text = m.group("subject").strip()
                  if kind == "feat":                             features.append(text)
                  elif kind == "fix":                           fixes.append(text)
                  elif kind in {"refactor","perf","ui","ux"}:   improvements.append(text)
                  else:                                         other.append(text)
              else:
                  other.append(s)

          lines = ["## Changes", ""]
          def sec(title, items):
              if items:
                  lines.extend([f"### {title}", ""] + [f"- {i}" for i in items] + [""])
          sec("Features", features)
          sec("Fixes", fixes)
          sec("Improvements", improvements)
          sec("Other Changes", other)
          if not (features or fixes or improvements or other):
              lines.extend(["- Maintenance and stability release.", ""])

          out = "\n".join(lines).rstrip() + "\n"
          Path("release-notes.md").write_text(out, encoding="utf-8")
          print(out)
          PY

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: mininotes-release-notes
          path: release-notes.md
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 2. Build .click packages (3 arches) using clickable build
  # ─────────────────────────────────────────────────────────────
  build_click:
    name: Build Click (${{ matrix.arch }})
    needs: []
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
            target_env_var: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
          - arch: armhf
            rust_target: armv7-unknown-linux-gnueabihf
            linker: arm-linux-gnueabihf-gcc
            target_env_var: CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER
          - arch: amd64
            rust_target: x86_64-unknown-linux-gnu
            linker: gcc
            target_env_var: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            click file dpkg-dev python3-pip \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          python3 -m pip install --break-system-packages \
            "clickable-ut==${{ env.CLICKABLE_VERSION }}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native_core -> target

      - name: Build Rust core (${{ matrix.arch }})
        env:
          RUSTFLAGS: "-C linker=${{ matrix.linker }}"
        run: |
          export ${{ matrix.target_env_var }}="${{ matrix.linker }}"
          cargo build \
            --manifest-path native_core/Cargo.toml \
            --release \
            --target ${{ matrix.rust_target }}

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: flutter_app

      - name: Build Flutter Linux (amd64 only – embedded in click bundle)
        if: matrix.arch == 'amd64'
        run: flutter build linux --release
        working-directory: flutter_app

      - name: Assemble Click bundle
        run: |
          set -euxo pipefail
          ARCH="${{ matrix.arch }}"
          BUNDLE="build/click_bundle"
          rm -rf "$BUNDLE"
          mkdir -p "$BUNDLE/lib" "$BUNDLE/assets/icons"

          # Flutter bundle (amd64 gets real build; arm64/armhf use stub)
          if [ -d "flutter_app/build/linux/x64/release/bundle" ]; then
            cp -R flutter_app/build/linux/x64/release/bundle/. "$BUNDLE/"
          elif [ -d "flutter_app/build/linux/arm64/release/bundle" ]; then
            cp -R flutter_app/build/linux/arm64/release/bundle/. "$BUNDLE/"
          elif [ -d "flutter_app/build/linux/arm/release/bundle" ]; then
            cp -R flutter_app/build/linux/arm/release/bundle/. "$BUNDLE/"
          fi

          # Rename executable – Flutter names it after pubspec 'name' field = 'mininote'
          # (arm64/armhf don't build Flutter so no binary is expected there)
          [ -f "$BUNDLE/flutter_app" ] && mv "$BUNDLE/flutter_app" "$BUNDLE/mininote" || true
          [ -f "$BUNDLE/mininote" ]    && chmod +x "$BUNDLE/mininote"               || true

          # Rust shared library
          RUST_SO="native_core/target/${{ matrix.rust_target }}/release/libnative_core.so"
          [ -f "$RUST_SO" ] || RUST_SO="native_core/target/release/libnative_core.so"
          cp "$RUST_SO" "$BUNDLE/lib/libnative_core.so"
          cp "$RUST_SO" "$BUNDLE/libnative_core.so"

          # Click packaging files
          cp packaging/click/mininotes.apparmor "$BUNDLE/mininotes.apparmor"
          cp packaging/click/mininotes.desktop   "$BUNDLE/mininotes.desktop"
          cp packaging/click/mininote-wrapper    "$BUNDLE/mininote-wrapper"
          cp assets/icons/mininotes.svg          "$BUNDLE/assets/icons/mininotes.svg"

          # Manifest with arch substituted
          sed "s/ARCH_PLACEHOLDER/${ARCH}/g" packaging/click/manifest.json > "$BUNDLE/manifest.json"

          # mininote-wrapper must always be executable
          chmod +x "$BUNDLE/mininote-wrapper"

          # Version from manifest
          VERSION="$(python3 -c "import json; print(json.load(open('$BUNDLE/manifest.json'))['version'])")"
          echo "CLICK_VERSION=$VERSION" >> "$GITHUB_ENV"

          # Also place in build/<arch>/app/ so clickable publish can find it
          mkdir -p "build/${ARCH}/app"

      - name: Package .click file
        run: |
          set -euxo pipefail
          ARCH="${{ matrix.arch }}"
          mkdir -p dist

          # click build outputs the .click in the current directory (no --output flag)
          click build build/click_bundle
          CLICK_FILE="$(find . -maxdepth 1 -name '*.click' | head -1)"
          test -f "$CLICK_FILE"
          mv "$CLICK_FILE" dist/
          CLICK_FILE="$(find dist -name '*.click' | head -1)"

          # Canonical name expected by clickable and openstore
          CANONICAL="dist/mininotes_${CLICK_VERSION}_${ARCH}.click"
          [ "$CLICK_FILE" = "$CANONICAL" ] || mv "$CLICK_FILE" "$CANONICAL"

          # Mirror into build/<arch>/app/ for lookup
          mkdir -p "build/${ARCH}/app"
          cp "$CANONICAL" "build/${ARCH}/app/mininotes_${CLICK_VERSION}_${ARCH}.click"
          cp "$CANONICAL" "build/mininotes_${CLICK_VERSION}_${ARCH}.click"

          echo "CLICK_FILE=$CANONICAL" >> "$GITHUB_ENV"
          ls -lh "$CANONICAL"

      - name: Validate Click package
        run: |
          set -euxo pipefail
          ARCH="${{ matrix.arch }}"
          CANONICAL="dist/mininotes_${CLICK_VERSION}_${ARCH}.click"
          test -f "$CANONICAL"

          echo "=== Validating Click package: $CANONICAL ==="
          click info "$CANONICAL"

          # Verify click review / lint
          if command -v clickable &>/dev/null; then
            clickable review "$CANONICAL" || echo "clickable review warning (non-fatal advisory)"
          fi

      - name: Upload Click artifact
        uses: actions/upload-artifact@v4
        with:
          name: mininotes-ubuntu-touch-${{ matrix.arch }}-click
          path: dist/*.click
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # 3. Publish to OpenStore & GitHub Release  (tags only)
  # ─────────────────────────────────────────────────────────────
  release:
    name: Publish to OpenStore & GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - notes
      - build_click
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all Click artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mininotes-ubuntu-touch-*-click
          path: dist/clicks
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: mininotes-release-notes
          path: .ci/release-notes

      - name: Prepare click files for GitHub & OpenStore
        run: |
          set -euxo pipefail
          mkdir -p dist/click
          cp -f dist/clicks/*.click dist/click/ || true
          ls -lh dist/click/

          # Verify we have all 3 expected architectures
          COUNT=$(find dist/click -name "*.click" | wc -l)
          if [ "$COUNT" -lt 3 ]; then
            echo "::error::Expected 3 .click packages (arm64, armhf, amd64), found $COUNT"
            exit 1
          fi

      - name: Upload All Click Packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          REPO="$GITHUB_REPOSITORY"
          FILES=$(find dist/click -name "*.click")

          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --repo "$REPO" --clobber
          else
            gh release create "$TAG" $FILES \
              --repo "$REPO" \
              --title "MiniNote $TAG" \
              --notes-file .ci/release-notes/release-notes.md
          fi

      - name: Publish to OpenStore (Authoritative direct API submission)
        env:
          OPENSTORE_API_KEY: ${{ secrets.OPENSTORE_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/publish_openstore.py
